[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyspark-snowflake-scd2"
version = "0.1.0"
description = "SCD Type 2 pipeline for a product catalog, built with PySpark and loaded into Snowflake"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyspark>=3.5,<4.0",
    "snowflake-connector-python>=3.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scd2_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
exclude = ["^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
